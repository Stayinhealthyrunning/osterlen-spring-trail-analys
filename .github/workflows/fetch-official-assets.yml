name: Fetch official ÖST source assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-official-assets.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch organizer-hosted GPX and PDF assets
        run: |
          python tools/fetch_official_assets.py || true

      - name: Show downloaded assets
        run: |
          find data/source -type f \( -name '*.gpx' -o -name '*.pdf' -o -name '*.sha256' \) -print | sort

      - name: Commit newly archived official assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source/gpx data/source/maps
          if git diff --cached --quiet; then
            echo 'No new source assets to commit.'
          else
            git commit -m 'Archive organizer-hosted ÖST source assets'
            git push
          fi
