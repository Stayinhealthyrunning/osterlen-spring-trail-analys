name: Profile ÖST frozen identity fields

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/archive/ost-results-2018-2026.sqlite.gz'
      - 'tools/profile_identity_fields_from_archive.py'
      - '.github/workflows/profile-identity-fields.yml'

permissions:
  contents: write

concurrency:
  group: ost-identity-fields
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Profile identity and list fields offline
        run: python tools/profile_identity_fields_from_archive.py
      - name: Commit aggregate identity field profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/identity-field-profile.json reports/identity-field-profile.md
          if git diff --cached --quiet; then
            echo 'Identity field profile already current.'
          else
            git commit -m 'Profile frozen ÖST identity fields'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
