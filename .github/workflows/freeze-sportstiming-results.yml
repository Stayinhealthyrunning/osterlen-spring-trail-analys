name: Freeze Sportstiming results (private destination required)

# Public source commits are permanently disabled. A new source freeze must use
# a separately write-scoped GitHub App and land in loppanalys-private-data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  require-private-writer-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy public source publication
        shell: bash
        run: |
          echo "Legacy source-freeze workflow is blocked: raw results must be written to the private source repository."
          echo "Configure the separate private-writer GitHub App and use a reviewed private-source update workflow."
          exit 1
