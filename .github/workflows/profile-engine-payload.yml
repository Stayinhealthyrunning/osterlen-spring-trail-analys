name: Profile ÖST Engine payload

on:
  push:
    branches:
      - prep/profile-engine-payload-2026-09-27
    paths:
      - 'tools/profile_engine_payload.py'
      - 'tools/export_engine_delivery.py'
      - 'tools/validate_performance_budget.py'
      - 'config/performance-budget.json'
      - 'research/frontend-delivery-architecture.md'
      - '.github/workflows/profile-engine-payload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Profile real Engine 1.0 payload
        run: python tools/profile_engine_payload.py
      - name: Export sharded browser delivery package
        run: python tools/export_engine_delivery.py --output-dir out/engine-delivery
      - name: Enforce performance budget
        run: python tools/validate_performance_budget.py
      - name: Commit measured payload profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/engine-payload-profile.json reports/engine-payload-profile.md
          if git diff --cached --quiet; then
            echo 'Payload profile already current.'
          else
            git commit -m 'Profile ÖST Engine 1.0 payload'
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Upload delivery prototype
        uses: actions/upload-artifact@v4
        with:
          name: ost-engine-delivery-prototype
          path: out/engine-delivery
          retention-days: 14
