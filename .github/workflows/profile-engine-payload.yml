name: Profile ÖST Engine payload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Profile real Engine 1.0 payload
        run: python tools/profile_engine_payload.py
      - name: Upload profile
        uses: actions/upload-artifact@v4
        with:
          name: ost-engine-payload-profile
          path: |
            reports/engine-payload-profile.json
            reports/engine-payload-profile.md
          retention-days: 30
