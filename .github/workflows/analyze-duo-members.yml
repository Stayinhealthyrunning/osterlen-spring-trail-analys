name: Analyze ÖST Duo member evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/archive/ost-results-2018-2026.sqlite.gz'
      - 'tools/analyze_duo_members_from_archive.py'
      - '.github/workflows/analyze-duo-members.yml'

concurrency:
  group: ost-duo-member-evidence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze Duo member/leg evidence
        run: python tools/analyze_duo_members_from_archive.py
      - name: Commit aggregate Duo evidence report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/duo-member-evidence.json reports/duo-member-evidence.md
          if git diff --cached --quiet; then
            echo 'Duo evidence report already current.'
          else
            git commit -m 'Analyze ÖST Duo member and leg evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
