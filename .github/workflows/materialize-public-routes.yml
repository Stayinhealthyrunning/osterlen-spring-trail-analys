name: Materialize public Trace route references

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/materialize_tracedetrail_public_routes.py'
      - 'tools/analyze_tracedetrail_public_geometry.py'
      - 'config/course-versions.json'
      - 'config/course-source-manifest.json'
      - 'data/source/tracedetrail/waypoints.json'
      - '.github/workflows/materialize-public-routes.yml'

concurrency:
  group: ost-materialize-public-routes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize verified public route geometry
        run: python tools/materialize_tracedetrail_public_routes.py
      - name: Commit derived route references
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routes/ost/ultra60-2018 routes/ost/ultra60-2019 routes/ost/ultra60-2022-2023
          git add routes/ost/trail22-2019 routes/ost/trail22-2022-2024 routes/ost/trail22-2025-2026
          git add routes/ost/trail14-current-reference/route.gpx routes/ost/trail14-current-reference/provenance.json
          git add reports/materialized-public-route-assets.json
          if git diff --cached --quiet; then
            echo 'No route asset changes.'
          else
            git commit -m 'Materialize verified public ÖST route references'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
