name: Export OST KMZ

on:
  push:
    branches:
      - tmp/export-ost-kmz

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build KMZ with all resolved route versions
        shell: python
        run: |
          import json, math, re, urllib.request, zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape

          ROOT = Path.cwd()
          OUT = ROOT / "out"
          OUT.mkdir(exist_ok=True)
          KML = OUT / "osterlen-spring-trail-alla-rutter.kml"
          KMZ = OUT / "osterlen-spring-trail-alla-rutter.kmz"

          ORIGIN = 20037508.342789244
          UA = "OST-analysis-research/1.0 (+https://github.com/Stayinhealthyrunning/osterlen-spring-trail-analys)"

          def quoted(text, start):
              q=text[start]; i=start+1; out=[]
              while i<len(text):
                  ch=text[i]
                  if ch=="\\":
                      if i+1>=len(text): break
                      n=text[i+1]
                      if n=="u" and i+5<len(text):
                          try:
                              out.append(chr(int(text[i+2:i+6],16))); i+=6; continue
                          except ValueError:
                              pass
                      out.append({"n":"\n","r":"\r","t":"\t","b":"\b","f":"\f","/":"/"}.get(n,n)); i+=2; continue
                  if ch==q:
                      return "".join(out), i+1
                  out.append(ch); i+=1
              raise ValueError("unterminated JS string")

          def balanced(text, start):
              op=text[start]; cl="}" if op=="{" else "]"; depth=0; q=None; esc=False
              for i in range(start,len(text)):
                  ch=text[i]
                  if q:
                      if esc: esc=False
                      elif ch=="\\": esc=True
                      elif ch==q: q=None
                      continue
                  if ch in ('"',"'"): q=ch; continue
                  if ch==op: depth+=1
                  elif ch==cl:
                      depth-=1
                      if depth==0:
                          return text[start:i+1], i+1
              raise ValueError("unterminated JS structure")

          def datatrace_object(html):
              m=re.search(r'(?<![A-Za-z0-9_])dataTrace\s*:\s*\{',html)
              if not m:
                  raise ValueError("dataTrace object not found")
              start=html.find("{",m.start())
              return balanced(html,start)[0]

          def top_properties(raw):
              props={}; i=1
              while i<len(raw)-1:
                  while i<len(raw) and (raw[i].isspace() or raw[i]==","): i+=1
                  if i>=len(raw)-1: break
                  if raw[i] in ('"',"'"):
                      key,i=quoted(raw,i)
                  else:
                      m=re.match(r'[A-Za-z_$][A-Za-z0-9_$]*',raw[i:])
                      if not m:
                          i+=1; continue
                      key=m.group(0); i+=len(key)
                  while i<len(raw) and raw[i].isspace(): i+=1
                  if i>=len(raw) or raw[i] != ":":
                      continue
                  i+=1
                  while i<len(raw) and raw[i].isspace(): i+=1
                  if i>=len(raw): break
                  if raw[i] in ('"',"'"):
                      value,i=quoted(raw,i)
                  elif raw[i] in "[{":
                      value,i=balanced(raw,i)
                  else:
                      j=i; depth=0; q=None; esc=False
                      while j<len(raw):
                          ch=raw[j]
                          if q:
                              if esc: esc=False
                              elif ch=="\\": esc=True
                              elif ch==q: q=None
                          else:
                              if ch in ('"',"'"): q=ch
                              elif ch in "[{(": depth+=1
                              elif ch in "]})": depth=max(0,depth-1)
                              elif ch=="," and depth==0: break
                          j+=1
                      value=raw[i:j].strip(); i=j
                  props[key]=value
              return props

          def mercator_to_wgs(x,y):
              lon=x/ORIGIN*180.0
              lat=y/ORIGIN*180.0
              lat=180/math.pi*(2*math.atan(math.exp(lat*math.pi/180))-math.pi/2)
              return lat,lon

          def trace_points(trace_id):
              url=f"https://tracedetrail.fr/fr/trace/{trace_id}"
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,*/*;q=0.8"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  html=r.read(8_000_000).decode("utf-8","replace")
              props=top_properties(datatrace_object(html))
              geom=json.loads(props["geometry"])
              pts=[]
              for p in geom:
                  if not isinstance(p,dict) or p.get("lon") is None or p.get("lat") is None:
                      continue
                  lat,lon=mercator_to_wgs(float(p["lon"]),float(p["lat"]))
                  ele=p.get("y")
                  pts.append((lon,lat,ele if isinstance(ele,(int,float)) else None))
              if len(pts)<2:
                  raise ValueError(f"Trace {trace_id}: too few points")
              return pts

          def gpx_points(path):
              ns={"g":"http://www.topografix.com/GPX/1/1"}
              tree=ET.parse(path)
              root=tree.getroot()
              pts=[]
              candidates=root.findall(".//g:trkpt",ns) or root.findall(".//g:rtept",ns)
              if not candidates:
                  candidates=root.findall(".//trkpt") or root.findall(".//rtept")
              for p in candidates:
                  lon=float(p.attrib["lon"]); lat=float(p.attrib["lat"])
                  ele_el=p.find("g:ele",ns)
                  if ele_el is None: ele_el=p.find("ele")
                  ele=float(ele_el.text) if ele_el is not None and ele_el.text else None
                  pts.append((lon,lat,ele))
              if len(pts)<2:
                  raise ValueError(f"{path}: too few GPX points")
              return pts

          routes = [
              {
                  "name":"Trail 5 km – 2026 referens",
                  "folder":"Kortbanor",
                  "style":"trail5",
                  "points":gpx_points(ROOT/"routes/ost/trail5-current-reference/route.gpx"),
                  "description":"Rekonstruerad referens från georefererad arrangörskarta/OSM. Inte officiell arrangörs-GPX."
              },
              {
                  "name":"Trail 13/14 km – 2026 referens",
                  "folder":"Kortbanor",
                  "style":"trail14",
                  "points":gpx_points(ROOT/"routes/ost/trail14-current-reference/route.gpx"),
                  "description":"Rekonstruerad referens från georefererad arrangörskarta. Inte officiell arrangörs-GPX."
              },
              {
                  "name":"Trail 21/22 km – 2019",
                  "folder":"Trail 21/22 km",
                  "style":"trail22_2019",
                  "points":trace_points(69864),
                  "description":"Verifierad publik Trace de Trail-kartgeometri för 2019."
              },
              {
                  "name":"Trail 21/22 km – 2022–2024",
                  "folder":"Trail 21/22 km",
                  "style":"trail22_2224",
                  "points":trace_points(165617),
                  "description":"Verifierad exakt publik Trace de Trail-kartgeometri; samma geometri 2022, 2023 och 2024."
              },
              {
                  "name":"Trail 21/22 km – 2025–2026",
                  "folder":"Trail 21/22 km",
                  "style":"trail22_2526",
                  "points":trace_points(280053),
                  "description":"Verifierad exakt publik Trace de Trail-kartgeometri; samma geometri 2025 och 2026."
              },
              {
                  "name":"Ultra 60 km – 2018",
                  "folder":"Ultra 60 km",
                  "style":"ultra18",
                  "points":trace_points(43970),
                  "description":"Verifierad publik Trace de Trail-kartgeometri för 2018."
              },
              {
                  "name":"Ultra 60 km – 2019",
                  "folder":"Ultra 60 km",
                  "style":"ultra19",
                  "points":trace_points(69381),
                  "description":"Verifierad publik Trace de Trail-kartgeometri för 2019."
              },
              {
                  "name":"Ultra 60 km – 2022–2023",
                  "folder":"Ultra 60 km",
                  "style":"ultra2223",
                  "points":trace_points(172147),
                  "description":"Verifierad exakt publik Trace de Trail-kartgeometri; samma geometri 2022 och 2023."
              },
              {
                  "name":"Ultra 60 km – 2024",
                  "folder":"Ultra 60 km",
                  "style":"ultra24",
                  "points":gpx_points(ROOT/"data/source/gpx/ultra60/ost-ultra60-2024-organizer.gpx"),
                  "description":"Arkiverad arrangörs-GPX för 2024."
              },
              {
                  "name":"Ultra 60 km – 2025–2026",
                  "folder":"Ultra 60 km",
                  "style":"ultra2526",
                  "points":gpx_points(ROOT/"data/source/gpx/ultra60/ost-ultra60-2025-2026-organizer.gpx"),
                  "description":"Arkiverad arrangörs-GPX; samma arrangörskälla för 2025 och 2026."
              },
          ]

          colors = {
              "trail5":"ffb4771f",
              "trail14":"ff0e7fff",
              "trail22_2019":"ff2ca02c",
              "trail22_2224":"ff2827d6",
              "trail22_2526":"ffbd6794",
              "ultra18":"ff4b568c",
              "ultra19":"ffc277e3",
              "ultra2223":"ff7f7f7f",
              "ultra24":"ff22bdbc",
              "ultra2526":"ffcfbe17",
          }

          def coords_text(pts):
              return " ".join(
                  f"{lon:.7f},{lat:.7f},{float(ele):.1f}" if ele is not None else f"{lon:.7f},{lat:.7f},0"
                  for lon,lat,ele in pts
              )

          styles = []
          for sid, col in colors.items():
              styles.append(
                  f'<Style id="{sid}"><LineStyle><color>{col}</color><width>5</width></LineStyle></Style>'
              )

          folders = []
          for folder in ["Kortbanor","Trail 21/22 km","Ultra 60 km"]:
              items=[]
              for r in routes:
                  if r["folder"] != folder: continue
                  items.append(
                      "<Placemark>"
                      f"<name>{escape(r['name'])}</name>"
                      f"<description>{escape(r['description'])}</description>"
                      f"<styleUrl>#{r['style']}</styleUrl>"
                      "<LineString><tessellate>1</tessellate><altitudeMode>clampToGround</altitudeMode>"
                      f"<coordinates>{coords_text(r['points'])}</coordinates>"
                      "</LineString></Placemark>"
                  )
              folders.append(f"<Folder><name>{escape(folder)}</name>{''.join(items)}</Folder>")

          kml = (
              '<?xml version="1.0" encoding="UTF-8"?>'
              '<kml xmlns="http://www.opengis.net/kml/2.2"><Document>'
              '<name>Österlen Spring Trail – alla rutter</name>'
              '<description>Samlad KMZ för Organic Maps. Innehåller 10 verifierade/referensbaserade banversioner. Kortbanorna 2026 är rekonstruerade referenser och markeras som sådana.</description>'
              + "".join(styles)
              + "".join(folders)
              + "</Document></kml>"
          )
          KML.write_text(kml,encoding="utf-8")
          with zipfile.ZipFile(KMZ,"w",zipfile.ZIP_DEFLATED) as z:
              z.write(KML,arcname="doc.kml")

          summary = {
              "routes":[{"name":r["name"],"points":len(r["points"]),"description":r["description"]} for r in routes]
          }
          (OUT/"route-summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))

      - name: Upload KMZ
        uses: actions/upload-artifact@v4
        with:
          name: ost-kmz
          path: |
            out/osterlen-spring-trail-alla-rutter.kmz
            out/osterlen-spring-trail-alla-rutter.kml
            out/route-summary.json
