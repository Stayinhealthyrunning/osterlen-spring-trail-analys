name: Route engine regression
on:
  push:
    branches: [automation/acquire-short-course-sources]
    paths:
      - 'route_engine/**'
      - '.github/workflows/route-engine-regression.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest route_engine.tests.test_engine
