name: Analyze short-course route sources
on:
  push:
    branches: [automation/acquire-short-course-sources]
    paths:
      - tools/summarize_osm_route_network.py
      - .github/workflows/acquire-short-course-sources.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/acquire-short-course-sources
          fetch-depth: 0
      - name: Analyze OSM network
        run: |
          mkdir -p reports
          python tools/summarize_osm_route_network.py data/source/osm/christinehof-path-network.geojson reports/christinehof-osm-network-summary.json
      - name: Inspect organizer rasters
        run: |
          python - <<'PY'
          from PIL import Image
          import json, pathlib
          out={}
          for p in ["data/source/maps/ost-trail5-organizer-map.jpg","data/source/maps/ost-trail13-14-organizer-map.jpg"]:
              im=Image.open(p).convert("RGB")
              pix=list(im.getdata())
              dark=sum(1 for r,g,b in pix if max(r,g,b)<80)
              nearblack=sum(1 for r,g,b in pix if max(r,g,b)<45)
              out[p]={"width":im.width,"height":im.height,"dark_pixels_lt80":dark,"nearblack_pixels_lt45":nearblack}
          pathlib.Path("reports/short-course-raster-summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Analyze short-course source geometry"; git push origin HEAD:automation/acquire-short-course-sources; fi
