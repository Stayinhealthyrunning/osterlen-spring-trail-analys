name: Reconstruct short-course routes
on:
  push:
    branches: [fix/trail14-skaneleden-backaleden-topology]
    paths:
      - 'tools/**'
      - '.github/workflows/analyze-short-course-rasters.yml'
      - 'data/source/**'
      - 'reports/organizer-map-registration.json'
  workflow_dispatch:
concurrency:
  group: short-course-reconstruction
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trail14-skaneleden-backaleden-topology
          fetch-depth: 0
      - run: python -m pip install --quiet opencv-python-headless numpy pyproj networkx scikit-image scipy
      - name: Preserve existing raster registration diagnostics
        run: test -f reports/organizer-map-registration.json
      - name: Extract OSM hiking relations
        run: python tools/extract_osm_hiking_relations.py data/source/osm/christinehof-short-courses.osm reports/christinehof-osm-hiking-relations.json
      - name: Reconstruct Trail 5
        run: |
          mkdir -p routes/ost/trail5-current-reference
          python tools/reconstruct_trail5_osm.py \
            --image data/source/maps/ost-trail5-organizer-map.jpg \
            --network data/source/osm/christinehof-path-network.geojson \
            --geojson routes/ost/trail5-current-reference/route.geojson \
            --gpx routes/ost/trail5-current-reference/route.gpx \
            --qa routes/ost/trail5-current-reference/qa.json 2>&1 | tee reports/trail5-reconstruction-run.log
      - name: Commit reconstruction diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/trail5-reconstruction-run.log reports/christinehof-osm-hiking-relations.json routes/ost/trail5-current-reference || true
          if ! git diff --cached --quiet; then git commit -m "Record Trail 5 reconstruction diagnostics"; git pull --rebase origin fix/trail14-skaneleden-backaleden-topology; git push origin HEAD:fix/trail14-skaneleden-backaleden-topology; fi
      - name: Reconstruct Trail 13/14
        run: |
          mkdir -p routes/ost/trail14-current-reference
          set +e
          set -o pipefail
          python tools/reconstruct_trail14_osm.py --image data/source/maps/ost-trail13-14-organizer-map.jpg --network data/source/osm/christinehof-path-network.geojson --registration reports/organizer-map-registration.json --relations reports/christinehof-osm-hiking-relations.json --trail5 routes/ost/trail5-current-reference/route.geojson --geojson routes/ost/trail14-current-reference/route.geojson --gpx routes/ost/trail14-current-reference/route.gpx --qa routes/ost/trail14-current-reference/qa.json 2>&1 | tee reports/trail14-reconstruction-run.log
          rc=${PIPESTATUS[0]}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/trail14-reconstruction-run.log routes/ost/trail14-current-reference/candidate-frontier.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "Record Trail 14 candidate diagnostics"; git pull --rebase origin fix/trail14-skaneleden-backaleden-topology; git push origin HEAD:fix/trail14-skaneleden-backaleden-topology; fi
          exit $rc
      - name: Commit Trail 13/14 diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/trail14-reconstruction-run.log routes/ost/trail14-current-reference
          if ! git diff --cached --quiet; then git commit -m "Record Trail 13/14 reconstruction diagnostics"; git pull --rebase origin fix/trail14-skaneleden-backaleden-topology; git push origin HEAD:fix/trail14-skaneleden-backaleden-topology; fi
      - name: Enforce Trail 5 QA gate
        run: |
          python - <<'PY'
          import json
          q=json.load(open("routes/ost/trail5-current-reference/qa.json"))
          assert 4.4 <= q["distance_km"] <= 5.6, q
          assert q["start_finish_gap_m"] <= 100, q
          assert q["median_route_to_raster_m"] <= 60, q
          print("Trail 5 QA gate passed",q)
          PY
      - name: Enforce Trail 13/14 QA gate
        run: |
          python - <<'PY'
          import json
          q=json.load(open("routes/ost/trail14-current-reference/qa.json"))
          assert 12.0 <= q["distance_km"] <= 15.0, q
          assert q["skane_out_m"] >= 1000, q
          assert q["back_return_m"] >= 1000, q
          assert q["start_finish_gap_m"] <= 100, q
          assert q["hallamolla_control_m"] <= 150, q
          assert q["shared_out_return_m"] <= 1400, q
          assert q["median_edge_to_raster_m"] <= 80, q
          # Candidate frontier is diagnostic; final acceptance remains blocked until\n          # a supported corridor resolves the remaining raster outliers.\n          assert q["p95_edge_to_raster_m"] <= 150, q
          print("Trail 13/14 QA gate passed",q)
          PY
      - name: Commit accepted reconstruction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/ost/trail5-current-reference routes/ost/trail14-current-reference reports/trail5-reconstruction-run.log reports/trail14-reconstruction-run.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update QA-passed Trail 5 reconstruction"
          git push origin HEAD:fix/trail14-skaneleden-backaleden-topology
