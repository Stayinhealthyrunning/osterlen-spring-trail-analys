name: Reconstruct short-course routes
on:
  push:
    branches:
      - automation/acquire-short-course-sources
      - 'codex/**'
    paths:
      - 'tools/**'
      - 'config/short-course-map-reconstruction.json'
      - '.github/workflows/analyze-short-course-rasters.yml'
      - 'data/source/**'
      - 'reports/organizer-map-registration.json'
  workflow_dispatch:
concurrency:
  group: short-course-reconstruction-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: python -m pip install --quiet opencv-python-headless numpy pyproj networkx scikit-image scipy
      - name: Preserve existing raster registration diagnostics
        run: test -f reports/organizer-map-registration.json
      - name: Extract OSM hiking relations
        run: python tools/extract_osm_hiking_relations.py data/source/osm/christinehof-short-courses.osm reports/christinehof-osm-hiking-relations.json
      - name: Reconstruct Trail 5 from organizer raster
        run: |
          mkdir -p routes/ost/trail5-current-reference
          python tools/reconstruct_trail5_osm.py \
            --image data/source/maps/ost-trail5-organizer-map.jpg \
            --network data/source/osm/christinehof-path-network.geojson \
            --geojson routes/ost/trail5-current-reference/route.geojson \
            --gpx routes/ost/trail5-current-reference/route.gpx \
            --qa routes/ost/trail5-current-reference/qa.json 2>&1 | tee reports/trail5-reconstruction-run.log
      - name: Reconstruct Trail 13/14 from its own organizer raster
        run: |
          mkdir -p routes/ost/trail14-current-reference
          set -o pipefail
          python tools/reconstruct_trail14_osm.py \
            --image data/source/maps/ost-trail13-14-organizer-map.jpg \
            --network data/source/osm/christinehof-path-network.geojson \
            --registration reports/organizer-map-registration.json \
            --relations reports/christinehof-osm-hiking-relations.json \
            --trail5 routes/ost/trail5-current-reference/route.geojson \
            --geojson routes/ost/trail14-current-reference/route.geojson \
            --gpx routes/ost/trail14-current-reference/route.gpx \
            --qa routes/ost/trail14-current-reference/qa.json 2>&1 | tee reports/trail14-reconstruction-run.log
      - name: Enforce corrected raster calibration and Trail 5 QA
        run: |
          python - <<'PY'
          import json
          q=json.load(open("routes/ost/trail5-current-reference/qa.json"))
          assert q["geometry_status"] == "validated_organizer_raster_reconstruction", q
          assert q["sweref99tm_controls"]["northeast"]["E"] == 437465.0, q
          assert 4.8 <= q["distance_km"] <= 5.2, q
          assert q["start_finish_gap_m"] <= 100, q
          assert abs(q["prototype_difference_m"]) <= 100, q
          print("Trail 5 QA gate passed", q)
          PY
      - name: Enforce organizer-raster Trail 13/14 QA
        run: |
          python - <<'PY'
          import json
          q=json.load(open("routes/ost/trail14-current-reference/qa.json"))
          assert q["geometry_status"] == "validated_organizer_raster_reconstruction", q
          assert q["sweref99tm_controls"]["northeast"]["E"] == 437465.0, q
          assert 12.5 <= q["distance_km"] <= 14.2, q
          assert q["start_finish_gap_m"] <= 150, q
          assert q["hallamolla_control_m"] <= 200, q
          assert q["map_registration_p95_px"] <= 3.0, q
          assert 1.0 <= q["topology"]["shared_connector_one_way_km"] <= 1.7, q
          print("Trail 13/14 QA gate passed", q)
          PY
      - name: Run generic route-engine regressions
        run: python -m unittest route_engine.tests.test_engine
      - name: Commit QA-passed reconstruction outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/ost/trail5-current-reference routes/ost/trail14-current-reference \
            reports/trail5-reconstruction-run.log reports/trail14-reconstruction-run.log \
            reports/christinehof-osm-hiking-relations.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate short-course routes with corrected raster calibration"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
