name: Reconstruct short-course routes
on:
  push:
    branches: [automation/acquire-short-course-sources]
    paths:
      - 'tools/**'
      - '.github/workflows/analyze-short-course-rasters.yml'
      - 'data/source/**'
      - 'reports/organizer-map-registration.json'
  workflow_dispatch:
concurrency:
  group: short-course-reconstruction
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/acquire-short-course-sources
          fetch-depth: 0
      - run: python -m pip install --quiet opencv-python-headless numpy pyproj networkx scikit-image scipy
      - name: Preserve existing raster registration diagnostics
        run: |
          test -f reports/organizer-map-registration.json
          test -f reports/trail14-route-skeleton.json
          test -f reports/trail5-osm-raster-match.json
      - name: Extract OSM hiking relations
        run: python tools/extract_osm_hiking_relations.py data/source/osm/christinehof-short-courses.osm reports/christinehof-osm-hiking-relations.json
      - name: Reconstruct Trail 5
        run: |
          mkdir -p routes/ost/trail5-current-reference
          python tools/reconstruct_trail5_osm.py \
            --image data/source/maps/ost-trail5-organizer-map.jpg \
            --network data/source/osm/christinehof-path-network.geojson \
            --geojson routes/ost/trail5-current-reference/route.geojson \
            --gpx routes/ost/trail5-current-reference/route.gpx \
            --qa routes/ost/trail5-current-reference/qa.json 2>&1 | tee reports/trail5-reconstruction-run.log
      - name: Commit reconstruction diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/trail5-reconstruction-run.log reports/christinehof-osm-hiking-relations.json routes/ost/trail5-current-reference || true
          if ! git diff --cached --quiet; then git commit -m "Record Trail 5 reconstruction diagnostics"; git pull --rebase origin automation/acquire-short-course-sources; git push origin HEAD:automation/acquire-short-course-sources; fi
      - name: Reconstruct Trail 13/14 from organizer raster
        run: |
          mkdir -p routes/ost/trail14-current-reference
          set -o pipefail
          python tools/reconstruct_trail14_raster.py \
            --skeleton reports/trail14-route-skeleton.json \
            --registration reports/organizer-map-registration.json \
            --trail5-georef reports/trail5-osm-raster-match.json \
            --trail5-qa routes/ost/trail5-current-reference/qa.json \
            --geojson routes/ost/trail14-current-reference/route.geojson \
            --gpx routes/ost/trail14-current-reference/route.gpx \
            --qa routes/ost/trail14-current-reference/qa.json \
            --provenance routes/ost/trail14-current-reference/provenance.json \
            --epsilon-px 4.0 2>&1 | tee reports/trail14-reconstruction-run.log
      - name: Commit Trail 13/14 diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/trail14-reconstruction-run.log routes/ost/trail14-current-reference
          if ! git diff --cached --quiet; then git commit -m "Record Trail 13/14 reconstruction diagnostics"; git pull --rebase origin automation/acquire-short-course-sources; git push origin HEAD:automation/acquire-short-course-sources; fi
      - name: Enforce Trail 5 QA gate
        run: |
          python - <<'PY'
          import json
          q=json.load(open("routes/ost/trail5-current-reference/qa.json"))
          assert 4.4 <= q["distance_km"] <= 5.6, q
          assert q["start_finish_gap_m"] <= 100, q
          assert q["median_route_to_raster_m"] <= 60, q
          print("Trail 5 QA gate passed",q)
          PY
      - name: Enforce Trail 13/14 QA gate
        run: |
          python - <<'PY'
          import json
          q=json.load(open("routes/ost/trail14-current-reference/qa.json"))
          assert 13.2 <= q["distance_km"] <= 14.2, q
          assert q["start_finish_gap_m"] <= 100, q
          assert 3.0 <= q["raster_simplification_epsilon_px"] <= 5.0, q
          assert q["map_registration_p95_px"] <= 2.0, q
          assert q["participant_reference_used_as_geometry_input"] is False, q
          assert q["participant_distance_delta_m"] <= 250, q
          assert q["publishable_as_reconstructed_route"] is True, q
          assert q["publishable_as_organizer_gpx"] is False, q
          print("Trail 13/14 raster QA gate passed",q)
          PY
      - name: Commit accepted reconstruction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/ost/trail5-current-reference routes/ost/trail14-current-reference reports/trail5-reconstruction-run.log reports/trail14-reconstruction-run.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update QA-passed short-course reconstructions"
          git push origin HEAD:automation/acquire-short-course-sources
