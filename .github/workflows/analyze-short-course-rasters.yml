name: Analyze short-course route rasters
on:
  push:
    branches: [automation/acquire-short-course-sources]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/acquire-short-course-sources
          fetch-depth: 0
      - run: |
          python -m pip install --quiet opencv-python-headless numpy pyproj
      - name: Match Trail 5 organizer raster to OSM
        run: |
          python tools/match_trail5_raster_to_osm.py --image data/source/maps/ost-trail5-organizer-map.jpg --network data/source/osm/christinehof-path-network.geojson --out reports/trail5-osm-raster-match.json
      - name: Commit match
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/trail5-osm-raster-match.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Match Trail 5 organizer raster to OSM"
          git push origin HEAD:automation/acquire-short-course-sources
