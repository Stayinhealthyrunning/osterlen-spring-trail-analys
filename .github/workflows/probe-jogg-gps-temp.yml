name: Probe public Jogg GPS

on:
  push:
    branches:
      - tmp/export-ost-kmz

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract public race GPS geometry
        shell: python
        run: |
          import json,re,urllib.request,math
          from pathlib import Path
          from xml.sax.saxutils import escape

          url="https://www.jogg.se/Traning/GPSPass.aspx?adid=10988506"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,*/*"})
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode("utf-8","replace")

          m=re.search(r'var\s+coords\s*=\s*(\[\[.*?\]\])\s*;',html,re.S)
          if not m:
              raise RuntimeError("coords array not found")
          coords=json.loads(m.group(1))
          pts=[(float(lat),float(lon)) for lat,lon,*_ in coords]

          R=6371008.8
          def hav(a,b):
              la1,lo1=map(math.radians,a); la2,lo2=map(math.radians,b)
              h=math.sin((la2-la1)/2)**2+math.cos(la1)*math.cos(la2)*math.sin((lo2-lo1)/2)**2
              return 2*R*math.asin(min(1,math.sqrt(h)))
          cum=[0.0]
          jumps=[]
          for i,(a,b) in enumerate(zip(pts,pts[1:])):
              d=hav(a,b); cum.append(cum[-1]+d)
              if d>50: jumps.append({"i":i,"jump_m":round(d,1),"from":a,"to":b})
          sf=hav(pts[0],pts[-1])

          out=Path("out-jogg"); out.mkdir(exist_ok=True)
          summary={
              "source_url":url,
              "point_count":len(pts),
              "haversine_path_km":round(cum[-1]/1000,3),
              "start":pts[0],"finish":pts[-1],
              "start_finish_gap_m":round(sf,1),
              "lat_range":[min(p[0] for p in pts),max(p[0] for p in pts)],
              "lon_range":[min(p[1] for p in pts),max(p[1] for p in pts)],
              "jumps_over_50m":jumps[:50],
              "source_note":"Public Jogg GPSPass activity for ÖST on 2023-04-16; participant text says race watch distance 13.67 km and race time 1:31:44."
          }
          (out/"summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          # Preserve only the public track coordinates, stripped of user/profile metadata.
          gpx=['<?xml version="1.0" encoding="UTF-8"?>',
               '<gpx version="1.1" creator="OST analysis - public Jogg GPSPass extraction" xmlns="http://www.topografix.com/GPX/1/1">',
               '<metadata><name>ÖST 13+ km participant GPS 2023-04-16</name><link href="'+escape(url)+'"/></metadata>',
               '<trk><name>ÖST 13+ km participant GPS 2023-04-16</name><trkseg>']
          for lat,lon in pts:
              gpx.append(f'<trkpt lat="{lat:.8f}" lon="{lon:.8f}"/>')
          gpx += ['</trkseg></trk></gpx>']
          (out/"ost-13plus-2023-participant-jogg-raw.gpx").write_text("\n".join(gpx)+"\n",encoding="utf-8")

          geo={"type":"Feature","properties":{"name":"ÖST 13+ km participant GPS 2023-04-16","source":url},
               "geometry":{"type":"LineString","coordinates":[[lon,lat] for lat,lon in pts]}}
          (out/"ost-13plus-2023-participant-jogg-raw.geojson").write_text(json.dumps(geo,ensure_ascii=False)+"\n",encoding="utf-8")
      - uses: actions/upload-artifact@v4
        with:
          name: jogg-public-race-track
          path: out-jogg/
