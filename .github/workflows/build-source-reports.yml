name: Build ÖST source reports

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/source/**'
      - 'config/**'
      - 'tools/analyze_gpx_sources.py'
      - 'tools/probe_sportstiming.py'
      - 'tools/discover_sportstiming_structure.py'
      - 'tools/inspect_sportstiming_client.py'
      - 'tools/build_sportstiming_catalog.py'
      - 'tools/sample_sportstiming_result_structure.py'
      - 'tools/inspect_sportstiming_tables.py'
      - 'tools/inspect_sportstiming_list_table.py'
      - 'tools/inventory_sportstiming_splits.py'
      - 'tools/inventory_sportstiming_points.py'
      - 'tools/inspect_sportstiming_relay.py'
      - 'tools/analyze_bengtemolla_double_timing.py'
      - 'tools/probe_tracedetrail_gpx_download.py'
      - 'tools/validate_source_model.py'
      - '.github/workflows/build-source-reports.yml'

concurrency:
  group: ost-source-reports-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze archived GPX
        run: python tools/analyze_gpx_sources.py
      - name: Probe public Sportstiming views
        run: python tools/probe_sportstiming.py
      - name: Discover Sportstiming page structure
        run: python tools/discover_sportstiming_structure.py
      - name: Inspect Sportstiming client request logic
        run: python tools/inspect_sportstiming_client.py
      - name: Build Sportstiming class catalog
        run: python tools/build_sportstiming_catalog.py
      - name: Sample Sportstiming result structure
        run: python tools/sample_sportstiming_result_structure.py
      - name: Inspect Sportstiming result tables
        run: python tools/inspect_sportstiming_tables.py
      - name: Inspect Sportstiming filtered list table
        run: python tools/inspect_sportstiming_list_table.py
      - name: Inventory Sportstiming split schemas
        run: python tools/inventory_sportstiming_splits.py
      - name: Inventory Sportstiming points and tracking
        run: python tools/inventory_sportstiming_points.py
      - name: Inspect Duo relay result structure
        run: python tools/inspect_sportstiming_relay.py
      - name: Analyze Bengtemölla double timing
        run: python tools/analyze_bengtemolla_double_timing.py
      - name: Probe Trace de Trail GPX download mechanism
        run: python tools/probe_tracedetrail_gpx_download.py
      - name: Validate source model
        run: python tools/validate_source_model.py
      - name: Commit generated metadata and reports
        shell: bash
        run: |
          paths=(reports/ data/source/sportstiming/class-catalog.json data/source/sportstiming/split-inventory.json data/source/sportstiming/points-tracking-inventory.json)
          if [[ -n "$(git status --porcelain -- "${paths[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${paths[@]}"
            git commit -m "Update ÖST source diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No generated changes"
          fi
