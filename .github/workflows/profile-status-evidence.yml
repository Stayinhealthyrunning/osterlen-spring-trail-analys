name: Profile ÖST frozen status evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/archive/ost-results-2018-2026.sqlite.gz'
      - 'tools/profile_status_evidence_from_frozen_sources.py'
      - '.github/workflows/profile-status-evidence.yml'

concurrency:
  group: ost-status-evidence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Profile all frozen status surfaces
        run: python tools/profile_status_evidence_from_frozen_sources.py
      - name: Commit aggregate status evidence report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/status-evidence-profile.json reports/status-evidence-profile.md
          if git diff --cached --quiet; then
            echo 'Status evidence report already current.'
          else
            git commit -m 'Profile frozen ÖST status evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
