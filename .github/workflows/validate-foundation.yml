name: Validate ÖST foundation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'data/source/sportstiming/**'
      - 'data/source/gpx/**'
      - 'research/**'
      - 'reports/**'
      - 'PREP_STATUS.md'
      - 'PREP_MANIFEST.json'
      - 'AGENTS.md'
      - 'README.md'
      - 'tools/validate_foundation.py'
      - 'tools/validate_prebuild_readiness.py'
      - '.github/workflows/build-source-reports.yml'
      - '.github/workflows/source-coverage.yml'
      - '.github/workflows/validate-foundation.yml'
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ['Build ÖST source reports', 'Build source coverage']
    types: [completed]

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate foundation contracts and cross-file consistency
        run: python tools/validate_foundation.py
      - name: Validate Engine 1.0 export against curated ÖST data
        run: python -m unittest tests/test_engine_v1_export.py
      - name: Validate final prebuild readiness
        run: python tools/validate_prebuild_readiness.py
      - name: Validate route elevation evidence
        run: python -m unittest tests/test_route_elevation_evidence.py
      - name: Validate short-course reference geometry
        run: python -m unittest tests/test_short_course_reference_geometry.py
