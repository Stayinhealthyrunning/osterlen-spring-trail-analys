name: Validate ÖST foundation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'tools/export_engine_delivery.py'
      - 'tools/profile_engine_payload.py'
      - 'tools/validate_performance_budget.py'
      - 'data/source/sportstiming/**'
      - 'data/source/gpx/**'
      - 'research/**'
      - 'reports/**'
      - 'PREP_STATUS.md'
      - 'PREP_MANIFEST.json'
      - 'AGENTS.md'
      - 'README.md'
      - 'tools/validate_foundation.py'
      - 'tools/validate_prebuild_readiness.py'
      - 'tools/audit_repository_hygiene.py'
      - 'tools/export_engine_v1.py'
      - 'tools/build_engine_readiness_report.py'
      - 'tools/export_engine_web_bundle.py'
      - 'tools/validate_frontend_performance_budget.py'
      - 'config/frontend-performance-budget.json'
      - 'tests/**'
      - 'route_engine/**'
      - '.github/workflows/build-source-reports.yml'
      - '.github/workflows/source-coverage.yml'
      - '.github/workflows/validate-foundation.yml'
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ['Build ÖST source reports', 'Build source coverage']
    types: [completed]

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate foundation contracts and cross-file consistency
        run: python tools/validate_foundation.py
      - name: Audit repository hygiene
        run: python tools/audit_repository_hygiene.py
      - name: Compile Python tooling
        run: python -m compileall -q tools tests route_engine
      - name: Run all repository unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate final prebuild readiness
        run: python tools/validate_prebuild_readiness.py
      - name: Validate Engine delivery performance budget
        run: python tools/validate_performance_budget.py
      - name: Validate frontend data performance budget
        run: python tools/validate_frontend_performance_budget.py
