name: ÖST Splits frontend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/build_frontend.py
      - run: python tools/validate_foundation.py
      - run: python tools/validate_prebuild_readiness.py
      - run: python tools/validate_frontend_performance_budget.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/frontend.test.mjs
      - run: node e2e/app.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ost-browser-qa
          path: artifacts/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

