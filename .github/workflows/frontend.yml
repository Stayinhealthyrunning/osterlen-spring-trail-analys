name: ÖST Splits frontend
env:
  LOPPANALYS_PRIVACY_REGISTRY_B64: ${{ secrets.LOPPANALYS_PRIVACY_REGISTRY_B64 }}
  LOPPANALYS_REQUIRE_PRIVATE_REGISTRY: "1"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      request_issue:
        description: "Optional trusted chat-command issue for outcome report"
        required: false
        type: string
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore access-controlled source inputs
        uses: ./.github/actions/restore-private-source
        with:
          app-id: ${{ secrets.LOPPANALYS_SOURCE_APP_ID }}
          private-key: ${{ secrets.LOPPANALYS_SOURCE_APP_PRIVATE_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/build_engine_readiness_report.py
      - run: python tools/build_frontend.py
      - run: python tools/audit_minors.py docs/data
      - run: python tools/validate_foundation.py
      - run: python tools/validate_prebuild_readiness.py
      - run: python tools/validate_frontend_performance_budget.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test tests/frontend.test.mjs
      - run: node e2e/app.cjs
      - run: node e2e/multi-year.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ost-browser-qa
          path: artifacts/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report-update:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.request_issue != '' }}
    needs: [frontend, deploy]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report actual rebuild and deployment outcome
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.request_issue }}
          BUILD_RESULT: ${{ needs.frontend.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 2
          if [[ "$BUILD_RESULT" == "success" && "$DEPLOY_RESULT" == "success" ]]; then
            message="Österlen: befintligt privat resultatarkiv har validerats och webbplatsen har byggts och publicerats. Detta flöde hämtar ännu inte nya Sportstiming-resultat."
          else
            message="Österlen: uppdateringen stoppades. Byggresultat: $BUILD_RESULT. Publiceringsresultat: $DEPLOY_RESULT. Befintlig sajt är oförändrad."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "$message [Körningsrapport](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."

