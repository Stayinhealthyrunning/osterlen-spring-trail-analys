name: Extract Christinehof hiking relations
on:
  push:
    branches: [automation/acquire-short-course-sources]
    paths: [tools/extract_osm_hiking_relations.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: automation/acquire-short-course-sources, fetch-depth: 0}
      - run: python tools/extract_osm_hiking_relations.py data/source/osm/christinehof-short-courses.osm reports/christinehof-osm-hiking-relations.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/christinehof-osm-hiking-relations.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract Christinehof OSM hiking relations"
          git push origin HEAD:automation/acquire-short-course-sources
