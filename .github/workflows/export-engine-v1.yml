name: Export ÖST Engine 1.0 handoff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild readiness in workspace
        run: python tools/build_engine_readiness_report.py
      - name: Validate source-side prebuild state
        run: |
          python tools/validate_foundation.py
          python tools/validate_prebuild_readiness.py
      - name: Export Engine 1.0 payload
        run: |
          mkdir -p out
          python tools/export_engine_v1.py --output out/ost-engine-v1.json
          gzip -9 -c out/ost-engine-v1.json > out/ost-engine-v1.json.gz
          sha256sum out/ost-engine-v1.json out/ost-engine-v1.json.gz > out/SHA256SUMS.txt
      - name: Profile payload and build browser delivery shards
        run: |
          python tools/profile_engine_payload.py
          python tools/build_engine_delivery_shards.py --output-dir out/engine-data --report out/engine-delivery-report.json
      - name: Build browser data bundle
        run: python tools/export_engine_web_bundle.py --output-dir out/web-data
      - name: Validate browser data budget
        run: python tools/validate_frontend_performance_budget.py
      - name: Upload handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: ost-engine-v1-handoff
          path: |
            out/ost-engine-v1.json.gz
            out/SHA256SUMS.txt
            out/engine-data/
            out/engine-delivery-report.json
            reports/engine-payload-profile.json
            reports/engine-payload-profile.md
            reports/engine-readiness.json
            reports/engine-readiness.md
            out/web-data/**
            config/frontend-performance-budget.json
          retention-days: 30
