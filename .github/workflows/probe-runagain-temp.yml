name: Probe public RunAgain route

on:
  push:
    branches:
      - tmp/export-ost-kmz

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover RunAgain public map API
        shell: python
        run: |
          import json,re,urllib.request
          from pathlib import Path
          from urllib.parse import urljoin

          page="https://runagain.com/da/find-lob/osterlen-spring-trail"
          req=urllib.request.Request(page,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode("utf-8","replace")
          scripts=[urljoin(page,x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)]
          hits=[]
          for u in scripts:
              try:
                  req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      js=r.read(4_000_000).decode("utf-8","replace")
              except Exception:
                  continue
              if not any(t in js for t in ["mapsArray","gpx_map","inputRaceCourse","RaceCourse","raceCourse","gpxMap"]):
                  continue
              snippets=[]
              for term in ["mapsArray","gpx_map","inputRaceCourse","raceCourse","gpxMap","/api/","fetch(","axios","graphql"]:
                  for m in list(re.finditer(re.escape(term),js,re.I))[:15]:
                      snippets.append({"term":term,"snippet":js[max(0,m.start()-500):m.end()+1000]})
              hits.append({"script":u,"bytes":len(js),"snippets":snippets[:80]})
          out=Path("out-runagain"); out.mkdir(exist_ok=True)
          (out/"runagain-js-api-hints.json").write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding="utf-8")
      - uses: actions/upload-artifact@v4
        with:
          name: runagain-js-api-hints
          path: out-runagain/runagain-js-api-hints.json
