name: Probe public RunAgain route

on:
  push:
    branches:
      - tmp/export-ost-kmz

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse RunAgain public route data
        shell: python
        run: |
          import json,re,urllib.request
          from pathlib import Path

          url="https://runagain.com/da/find-lob/osterlen-spring-trail"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,*/*"})
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode("utf-8","replace")

          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',html,re.S)
          if not m:
              raise RuntimeError("__NEXT_DATA__ missing")
          data=json.loads(m.group(1))
          pp=data.get("props",{}).get("pageProps",{})

          def decode(v):
              if isinstance(v,str):
                  try: return json.loads(v)
                  except Exception: return v
              return v

          decoded={k:decode(v) for k,v in pp.items()}
          # Keep only route/course-related page data and high-level keys.
          summary={
             "page_prop_keys":sorted(pp.keys()),
             "inputTabsArray":decoded.get("inputTabsArray"),
             "inputRaceCourse":decoded.get("inputRaceCourse"),
             "mapsArray":decoded.get("mapsArray"),
             "inputMapsArray":decoded.get("inputMapsArray"),
             "run_data_keys":sorted(decoded.get("inputRunData",{}).keys()) if isinstance(decoded.get("inputRunData"),dict) else None,
             "run_data_subset":{k:decoded.get("inputRunData",{}).get(k) for k in [
               "post_title","nid","gpx_map","lat","lon","latitude","longitude","map","maps","race_course","course","routes"
             ]} if isinstance(decoded.get("inputRunData"),dict) else None
          }
          # Recursively find route-ish keys and strings/arrays in pageProps.
          hits=[]
          def walk(x,path="$",depth=0):
              if depth>8 or len(hits)>300: return
              if isinstance(x,dict):
                  for k,v in x.items():
                      lk=str(k).lower()
                      if any(t in lk for t in ["map","route","course","gpx","track","coord","geo","lat","lon"]):
                          hits.append({"path":path+"."+str(k),"type":type(v).__name__,"value":v if isinstance(v,(str,int,float,bool,type(None))) else (v[:5] if isinstance(v,list) else list(v.keys())[:30])})
                      walk(v,path+"."+str(k),depth+1)
              elif isinstance(x,list):
                  for i,v in enumerate(x[:50]): walk(v,f"{path}[{i}]",depth+1)
          walk(decoded)
          summary["recursive_hits"]=hits

          out=Path("out-runagain"); out.mkdir(exist_ok=True)
          (out/"runagain-route-data.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
      - uses: actions/upload-artifact@v4
        with:
          name: runagain-route-data
          path: out-runagain/runagain-route-data.json
