name: Probe public RunAgain route

on:
  push:
    branches:
      - tmp/export-ost-kmz

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect RunAgain public route page
        shell: python
        run: |
          import json,re,urllib.request
          from pathlib import Path
          from urllib.parse import urljoin

          urls=[
            "https://runagain.com/da/find-lob/osterlen-spring-trail",
            "https://runagain.com/sv/lopp/osterlen-spring-trail",
            "https://runagain.com/en/find-race/osterlen-spring-trail"
          ]
          out=Path("out-runagain"); out.mkdir(exist_ok=True)
          report=[]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,*/*"})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      html=r.read().decode("utf-8","replace"); final=r.geturl()
              except Exception as e:
                  report.append({"url":url,"error":repr(e)}); continue
              scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
              hints=[]
              terms=["gpx","geojson","polyline","coordinates","lat","lng","route","14 km","Ekopark","mapbox","leaflet","__NEXT_DATA__","json"]
              for term in terms:
                  mm=list(re.finditer(re.escape(term),html,re.I))
                  for m in mm[:12]:
                      hints.append({"term":term,"snippet":re.sub(r'\s+',' ',html[max(0,m.start()-250):m.end()+700])[:950]})
              coordpairs=re.findall(r'(?<!\d)(5[45-6]\.[0-9]{4,})\s*[,;]\s*(1[3-4]\.[0-9]{4,})(?!\d)',html)
              report.append({
                  "url":url,"final":final,"bytes":len(html),
                  "scripts":[urljoin(final,x) for x in scripts],
                  "coord_pair_count":len(coordpairs),
                  "first_coord_pairs":coordpairs[:20],
                  "hints":hints[:120]
              })
          (out/"runagain-route-diagnostics.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
      - uses: actions/upload-artifact@v4
        with:
          name: runagain-route-diagnostics
          path: out-runagain/runagain-route-diagnostics.json
