name: Reconstruct Trail22 organizer reference
on:
  push:
    branches:
      - 'codex/**'
    paths:
      - 'tools/reconstruct_trail22_organizer_pdf.py'
      - 'data/source/maps/ost-trail21-2019-organizer-map.pdf'
      - '.github/workflows/reconstruct-trail22-organizer-reference.yml'
  workflow_dispatch:
concurrency:
  group: trail22-organizer-reference-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf opencv-python-headless numpy scipy
      - name: Reconstruct from organizer PDF
        run: |
          mkdir -p routes/ost/trail22-2019-organizer-reference
          python tools/reconstruct_trail22_organizer_pdf.py \
            --pdf data/source/maps/ost-trail21-2019-organizer-map.pdf \
            --gpx routes/ost/trail22-2019-organizer-reference/route.gpx \
            --geojson routes/ost/trail22-2019-organizer-reference/route.geojson \
            --qa routes/ost/trail22-2019-organizer-reference/qa.json
      - name: QA
        run: |
          python - <<'PY'
          import json
          q=json.load(open("routes/ost/trail22-2019-organizer-reference/qa.json"))
          assert q["geometry_status"] == "validated_organizer_pdf_reference", q
          assert 21.2 <= q["distance_km"] <= 22.3, q
          assert q["registration_pixel_distance"]["median"] <= 10, q
          assert q["registration_pixel_distance"]["p95"] <= 25, q
          print("Trail22 organizer-PDF QA passed", q)
          PY
      - name: Commit route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/ost/trail22-2019-organizer-reference
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add organizer-PDF Trail22 reference route"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
