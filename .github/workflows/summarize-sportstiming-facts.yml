name: Summarize Sportstiming event facts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'reports/sportstiming-event-discovery.json'
      - 'tools/summarize_sportstiming_event_facts.py'
      - '.github/workflows/summarize-sportstiming-facts.yml'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/summarize_sportstiming_event_facts.py
      - name: Commit fact sheets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sportstiming-event-facts.json reports/sportstiming-event-facts.md
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Summarize Sportstiming event facts'
            git push
          fi
