name: Discover historical organizer assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/discover_wayback_assets.py'
      - '.github/workflows/discover-wayback-assets.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query Internet Archive CDX
        run: python tools/discover_wayback_assets.py
      - name: Commit discovery report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/wayback-organizer-assets.json
          if git diff --cached --quiet; then
            echo 'No report changes.'
          else
            git commit -m 'Record historical organizer asset discovery'
            git push
          fi
