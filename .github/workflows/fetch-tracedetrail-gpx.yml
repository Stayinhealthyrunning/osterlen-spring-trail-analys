name: Fetch Trace de Trail GPX archive

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fetch_tracedetrail_gpx.py'
      - 'data/source/tracedetrail/tracks.json'
      - '.github/workflows/fetch-tracedetrail-gpx.yml'

concurrency:
  group: ost-tracedetrail-gpx
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public route-only GPX files
        run: python tools/fetch_tracedetrail_gpx.py --all
      - name: Commit GPX source archive and provenance manifest
        shell: bash
        run: |
          paths=(data/source/tracedetrail/gpx data/source/tracedetrail/gpx-download-manifest.json)
          if [[ -n "$(git status --porcelain -- "${paths[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${paths[@]}"
            git commit -m "Archive public Trace de Trail GPX sources"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No GPX archive changes"
          fi
