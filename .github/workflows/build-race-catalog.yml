name: Build race catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_race_catalog.py'
      - '.github/workflows/build-race-catalog.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_race_catalog.py
      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/race-catalog.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Build modern ÖST race catalog'
            git push
          fi
