name: Verify Trail22 2018 candidate
on:
  push:
    branches:
      - 'codex/**'
    paths:
      - 'tools/verify_trail22_2018.py'
      - 'tools/analyze_tracedetrail_public_geometry.py'
      - '.github/workflows/verify-trail22-2018.yml'
  workflow_dispatch:
concurrency:
  group: verify-trail22-2018-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Triangulate 2018 candidate against race-day controls
        run: python tools/verify_trail22_2018.py
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/trail22-2018-triangulation.json reports/trail22-2018-triangulation.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Trail22 2018 triangulation"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
